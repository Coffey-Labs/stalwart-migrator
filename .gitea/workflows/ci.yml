# CI on the self-hosted Gitea, ported from .gitlab-ci.yml during the move off
# GitLab (2026-09-22). Gitea reads .gitea/workflows and ignores .github/ once
# this directory exists; .github/workflows is GitHub's side of the switch below.
#
# Every job runs in an image pinned by digest (tag in the trailing comment),
# and the only action used is coffey-labs/actions/checkout pinned by SHA. The
# instance resolves short `uses:` against itself, never GitHub, so nothing
# unreviewed can be pulled in.
#
# The shape is the same as before -- tag-driven, amd64 and arm64,
# reproducible. GitLab needed a generic package registry plus release-cli
# links; Gitea attaches the tarballs to the Release itself, as GitHub did, so
# the build and the release are one job and nothing is handed between jobs.
#
# BUILD ON GITHUB. The org variable BUILD_ON decides which forge builds.
# Unset (or anything but 'github'), the test and release jobs below run here,
# as they always have. Set to 'github', they skip and .github/workflows/ci.yml
# does the same work on GitHub's runners -- GitHub holds a push mirror of this
# repository, updated on every commit -- and reports back as the commit status
# "github/ci (branch)" or "github/ci (tag)". The `github` job waits for that
# status and passes or fails with it, so a run here still says whether the
# commit is good. If GitHub is ever unavailable, unset BUILD_ON and everything
# builds here again.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ vars.BUILD_ON != 'github' }}
    runs-on: light
    container:
      image: golang:1.26-bookworm@sha256:a688600ca24f8a4d3ca77f95b0dd40704a9fc787c826660eb7ba0b641b8b175d # 1.26-bookworm
    steps:
      - uses: coffey-labs/actions/checkout@fab0c4d45e0162963965f1555df27b7bed5e20ec
      - run: go vet ./...
      - run: go test ./...
      # Kept as `go run ...@latest` exactly as the workflow had it: the point
      # of a vulnerability check is to use today's database, not a pinned copy
      # of last month's.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release:
    if: ${{ vars.BUILD_ON != 'github' && startsWith(github.ref, 'refs/tags/') }}
    needs: [test]
    runs-on: light
    container:
      image: golang:1.26-bookworm@sha256:a688600ca24f8a4d3ca77f95b0dd40704a9fc787c826660eb7ba0b641b8b175d # 1.26-bookworm
    steps:
      # Full history: the ancestry check below cannot be answered from a
      # shallow clone. The checkout also fetches every branch as origin/*.
      - uses: coffey-labs/actions/checkout@fab0c4d45e0162963965f1555df27b7bed5e20ec
        with:
          fetch-depth: 0
      # The workflow refused to release a tag that is not an ancestor of main,
      # so that a release can never describe code that was never reviewed onto
      # the default branch.
      - shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$(git rev-parse "${TAG}^{commit}")" origin/main \
            || { echo "!! $TAG is not on main"; exit 1; }
      # SOURCE_DATE_EPOCH is what makes the tarballs reproducible: without it
      # every build stamps a new mtime and two builds of one tag differ.
      - shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$TAG")" scripts/build-release.sh "$TAG" dist
          sha256sum dist/*.tar.gz
      # Create the Release, then attach every file. Archive names carry no
      # version, so /releases/latest/download/<name> always means the newest.
      # The API is reached on the internal address so the uploads never cross
      # Cloudflare. If an upload fails the half-made Release is deleted: a
      # Release whose assets 404 is worse than no Release, since the install
      # guide sends people straight at these URLs.
      - shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # CI_SERVER_INTERNAL is set on every job container by the runner.
          API="$CI_SERVER_INTERNAL/api/v1/repos/$REPO"
          auth=(--header "Authorization: token $TOKEN")
          id=$(curl --fail --silent --show-error "${auth[@]}" \
                --header "Content-Type: application/json" \
                --data "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Binaries for linux/amd64 and linux/arm64. Verify with SHA256SUMS.\"}" \
                "$API/releases" | grep -o '^{"id":[0-9]*' | cut -d: -f2)
          [ -n "$id" ] || { echo "!! could not create the release"; exit 1; }
          for f in dist/*; do
            n=$(basename "$f")
            echo "uploading $n"
            curl --fail --silent --show-error --output /dev/null "${auth[@]}" \
              --form "attachment=@$f" "$API/releases/$id/assets?name=$n" \
              || { curl --silent "${auth[@]}" -X DELETE "$API/releases/$id"; exit 1; }
          done

  # Stands in for test and release while GitHub builds: waits for the status
  # GitHub's ci.yml posts on this commit and passes or fails with it. A pull
  # request is checked at its head commit, which is what GitHub built when
  # the branch reached the mirror. Two and a half hours covers a slow queue;
  # a timeout here with BUILD_ON=github usually means GitHub never got the
  # push -- check the mirror's last error in the repository settings.
  github:
    if: ${{ vars.BUILD_ON == 'github' }}
    # Its own runner label with plenty of slots: this job only polls, but holds a slot
    # for as long as the GitHub build takes, and must not starve the build runners.
    runs-on: wait
    timeout-minutes: 150
    container:
      image: golang:1.26-bookworm@sha256:a688600ca24f8a4d3ca77f95b0dd40704a9fc787c826660eb7ba0b641b8b175d # 1.26-bookworm
    steps:
      - shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq --no-install-recommends jq >/dev/null
          ctx="github/ci (branch)"; [ "$IS_TAG" = true ] && ctx="github/ci (tag)"
          echo "waiting for '$ctx' on $SHA"
          while :; do
            s="$(curl -fsS -H "Authorization: token $TOKEN" \
                  "$CI_SERVER_INTERNAL/api/v1/repos/$REPO/commits/$SHA/statuses?limit=50" \
                  | jq -c --arg c "$ctx" '[.[] | select(.context == $c)] | sort_by(.id) | last // empty')" || s=""
            state="$(printf '%s' "$s" | jq -r '.status // .state // empty')"
            case "$state" in
              success) echo "GitHub: success"; exit 0 ;;
              failure|error) echo "GitHub: $state -- $(jq -r '.target_url' <<<"$s")"; exit 1 ;;
            esac
            sleep 20
          done

  # The release above is made with the job's own token, and Gitea starts no
  # workflow for events the Actions bot causes -- announce.yml's
  # 'on: release' never fires for it -- so announce it from here. When GitHub
  # builds, the Release is made there and published only once its files are
  # attached; this waits for GitHub's success and announces then. The action
  # makes one topic per tag, so a second announce for the same tag is a no-op.
  announce:
    needs: [release, github]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && (needs.release.result == 'success' || needs.github.result == 'success') }}
    runs-on: light
    steps:
      - uses: coffey-labs/actions/discourse-release@fd5fc9fb7da5f13d055f18b4bd5234c5fe5230d1
        with:
          api-key: ${{ secrets.DISCOURSE_RELEASE_KEY }}
          discord-webhook: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          tag: ${{ github.ref_name }}
